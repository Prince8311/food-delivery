<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/modal.css">

     <!-- font awesome -->
     <script src="js/fontawesome.js"></script>

</head>
<body>

    <div class="modal_wrapper">
        <div class="modal_box">
            <div class="modal_close"> <a><i class="fa-solid fa-xmark"></i></a></div>
            <div class="modal_inner">
                <div class="modal_img_sec">
                    <img src="img/add-request-img.svg" alt="">
                </div>
                <div class="content_sec">
                    <div class="content_head">
                        <h6><span>Special</span><i class="fa-solid fa-angle-right"></i><span>Meal Deal 1</span><i class="fa-solid fa-angle-right"></i><span>Customise Pizza 1</span><i class="fa-solid fa-angle-right"></i><span>Instructions</span></h6>
                        <p>Customise your chicken Pizza</p>
                    </div>
                    <div class="content_list">
                        <div class="product_box">
                            <div class="product_img">
                                <img src="img/margherita.svg" alt="">
                            </div>
                            <div class="product_name">
                                <h4>Add your special request</h4>
                            </div>
                        </div>
                        <div class="customize_sec">
                            <div class="customize_box">
                                <div class="box_head">
                                    <div class="img">
                                        <img src="img/Carrot.svg" alt="">
                                    </div>
                                    <h4>Vegitable Toppings</h4>
                                </div>
                                <div class="box_inner">
                                    <label>
                                        <input type="checkbox">
                                        <span><i class="fa-solid fa-check"></i></span>
                                        <p>Chees</p>
                                    </label>
                                    <label>
                                        <input type="checkbox">
                                        <span><i class="fa-solid fa-check"></i></span>
                                        <p>Green peppers</p>
                                    </label>
                                    <label>
                                        <input type="checkbox">
                                        <span><i class="fa-solid fa-check"></i></span>
                                        <p>Tomato</p>
                                    </label>
                                    <label>
                                        <input type="checkbox">
                                        <span><i class="fa-solid fa-check"></i></span>
                                        <p>Mushrooms</p>
                                    </label>
                                    <label>
                                        <input type="checkbox">
                                        <span><i class="fa-solid fa-check"></i></span>
                                        <p>Sweetcors</p>
                                    </label>
                                    <label>
                                        <input type="checkbox">
                                        <span><i class="fa-solid fa-check"></i></span>
                                        <p>Jalapeneos</p>
                                    </label>
                                    <label>
                                        <input type="checkbox">
                                        <span><i class="fa-solid fa-check"></i></span>
                                        <p>Olives</p>
                                    </label>
                                    <label>
                                        <input type="checkbox">
                                        <span><i class="fa-solid fa-check"></i></span>
                                        <p>Pineapples</p>
                                    </label>
                                    <label>
                                        <input type="checkbox">
                                        <span><i class="fa-solid fa-check"></i></span>
                                        <p>Onions</p>
                                    </label>
                                </div>
                            </div>
                            <div class="customize_box">
                                <div class="box_head">
                                    <div class="img">
                                        <img src="img/Carrot.svg" alt="">
                                    </div>
                                    <h4>Meat Toppings</h4>
                                </div>
                                <div class="box_inner">
                                    <label>
                                        <input type="checkbox">
                                        <span><i class="fa-solid fa-check"></i></span>
                                        <p>Chicken</p>
                                    </label>
                                    <label>
                                        <input type="checkbox">
                                        <span><i class="fa-solid fa-check"></i></span>
                                        <p>Beef</p>
                                    </label>
                                    <label>
                                        <input type="checkbox">
                                        <span><i class="fa-solid fa-check"></i></span>
                                        <p>Salami</p>
                                    </label>
                                    <label>
                                        <input type="checkbox">
                                        <span><i class="fa-solid fa-check"></i></span>
                                        <p>Pepperoni</p>
                                    </label>
                                    <label>
                                        <input type="checkbox">
                                        <span><i class="fa-solid fa-check"></i></span>
                                        <p>Chicken Tikka</p>
                                    </label>
                                    <label>
                                        <input type="checkbox">
                                        <span><i class="fa-solid fa-check"></i></span>
                                        <p>Fish</p>
                                    </label>
                                </div>
                            </div>
                            <div class="customize_box">
                                <div class="box_head">
                                    <div class="img">
                                        <img src="img/Carrot.svg" alt="">
                                    </div>
                                    <h4>Seafood Toppings</h4>
                                </div>
                                <div class="box_inner">
                                    <label>
                                        <input type="checkbox">
                                        <span><i class="fa-solid fa-check"></i></span>

                                    <label>

                                    </label>
                                    <label>
                                        <input type="checkbox">
                                        <span><i class="fa-solid fa-check"></i></span>
                                        <p>Prawns</p>
                                    </label>
                                </div>
                            </div>
                        </div>
                        
                    </div>
                    <div class="list_btns">
                        <div class="top_list">
                            <button>Total to pay <span>£127.90</span></button>
                            <p>Delivery & Tax will be calculated in the next step</p>
                        </div>
                        <div class="bottom_list">
                            <p>Take me back</p>
                            <button><a><img src="img/check-out-btn.svg" alt=""></a>Next Step</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

</html>
